<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Linux Web Server</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Welcome to My Linux Web Server</h1>

        <p class="intro">
            This website is hosted on Ubuntu Linux using the Apache web server.
        </p>

        <div class="server-info">

            <h2>Server Information</h2>

            <div class="info-item">
                <strong>Operating System:</strong>
                <span>Ubuntu Linux</span>
            </div>

            <div class="info-item">
                <strong>Web Server:</strong>
                <span>Apache</span>
            </div>

            <div class="info-item">
                <strong>Protocol:</strong>
                <span>HTTP</span>
            </div>

        </div>

        <div class="features">

            <h2>Server Features</h2>

            <ul>
                <li>Ubuntu Linux Operating System</li>
                <li>Apache Web Server</li>
                <li>HTTP Protocol</li>
            </ul>

        </div>

    </div>

</body>

</html>
