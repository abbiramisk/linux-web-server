<VirtualHost *:443>

    ServerName linuxweb.local

    DocumentRoot /var/www/linuxweb

    SSLEngine on

    SSLCertificateFile /etc/apache2/ssl/linuxweb.crt
    SSLCertificateKeyFile /etc/apache2/ssl/linuxweb.key

    <Directory /var/www/linuxweb>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/linuxweb_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/linuxweb_ssl_access.log combined

</VirtualHost>
